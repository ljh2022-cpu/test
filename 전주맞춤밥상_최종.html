<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전주 맞춤밥상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --yellow:#FFD84D; --yellow-soft:#FFF1B8; --ink:#1A1A1A; --mute:#6A6453;
  --bg:#FBF8F1; --card:#fff; --line:#E7E1D2;
  --ok:#1D7A4B; --unsure:#9A5B00; --no:#B3321F;
  --r:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Noto Sans KR',system-ui,-apple-system,"Malgun Gothic",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ---- 상단 ---- */
.demo-bar{background:var(--ink);color:var(--yellow);font-size:13px;text-align:center;padding:6px 16px}
.top{background:var(--yellow)}
.top-in{display:flex;align-items:center;justify-content:space-between;min-height:60px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.5px}
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 18px;font-weight:700;min-height:40px;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--yellow)}
.seg-sm button{padding:4px 12px;min-height:32px;font-size:13px}
.hero{background:var(--yellow);padding:24px 0 72px}
.hero h1{margin:0 0 12px;font-size:clamp(34px,6vw,60px);line-height:1.1;font-weight:800;letter-spacing:-2px}
.hero p{margin:0;max-width:520px;font-size:18px;color:#3b3825}

/* ---- 입력 폼 ---- */
.planner{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:-48px;padding:8px 24px 24px;box-shadow:0 8px 28px #1a1a1a14}
.step{padding:20px 0;border-bottom:1px solid var(--line)}
.step:last-of-type{border-bottom:0}
.step h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:17px;font-weight:800}
.n{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--yellow);font-size:13px}
.hint{margin:-6px 0 10px;color:var(--mute);font-size:14px}
.when{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.arrow{align-self:flex-end;padding-bottom:10px;font-weight:800;font-size:20px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--mute)}
input[type=date],input[type=time]{font:inherit;font-weight:700;color:var(--ink);padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-height:44px}
input[type=date]:hover,input[type=time]:hover{border-color:var(--ink)}
.how{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;min-height:44px}
.switch input{position:absolute;opacity:0}
.track{width:44px;height:26px;border-radius:99px;background:#CFC8B4;position:relative;transition:background .15s}
.track::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+.track{background:var(--ink)}
.switch input:checked+.track::after{transform:translateX(18px)}
.switch input:focus-visible+.track{outline:3px solid var(--ink);outline-offset:2px}

.person{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;margin-bottom:8px;background:var(--bg);border-radius:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--yellow);border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.chip{position:relative}
.chip input{position:absolute;opacity:0}
.chip span{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border:1.5px solid var(--line);background:#fff;border-radius:99px;cursor:pointer;font-weight:700;font-size:14px}
.chip input:checked+span{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
.chip input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
.rm{margin-left:auto;border:0;background:none;color:var(--mute);font-size:20px;line-height:1;min-width:36px;min-height:36px;border-radius:8px}
.rm:hover{color:var(--no)}
.ghost{border:1.5px dashed var(--ink);background:transparent;border-radius:12px;padding:8px 16px;font-weight:700;min-height:40px}
.cta{width:100%;margin-top:8px;min-height:56px;border:0;border-radius:16px;background:var(--ink);color:var(--yellow);font-size:18px;font-weight:800}
.cta:active{transform:scale(.99)}
.examples{display:flex;gap:16px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--mute);text-decoration:underline;font-size:14px;min-height:36px}

/* ---- 결과 ---- */
#result{padding:32px 0 80px}
.alert{background:#FBE3DF;color:#6E1C10;border-radius:14px;padding:12px 16px;margin-bottom:16px;font-weight:700;font-size:14px}
.note{background:#fff;border:1.5px dashed var(--ink);border-radius:14px;padding:10px 16px;margin-bottom:16px;font-size:14px}
.day{margin-bottom:32px}
.day-h{display:flex;align-items:center;gap:12px;margin:0 0 12px;font-size:22px;font-weight:800;letter-spacing:-.5px}
.day-h::after{content:"";flex:1;border-top:2px solid var(--ink)}
.sum{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;margin-bottom:16px}
.sum-main{flex:1 1 260px;background:var(--ink);color:var(--yellow);border-radius:var(--r);padding:18px 22px}
.sum-main small{display:block;color:#E8D68A;font-size:13px}
.sum-main b{font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-1px}
.stat{flex:1 1 140px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.stat small{display:block;color:var(--mute);font-size:13px}
.stat b{font-size:28px;font-weight:800}
.day-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:900px){
  .day-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px}
  .col-map{position:sticky;top:16px;align-self:start}
}

/* 타임라인 */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;border-left:2px dashed #CFC8B4}
.tl-i{position:relative;display:flex;gap:14px;padding-bottom:16px}
.tl-n{flex:none;z-index:1;width:32px;height:32px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.tl-c{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tl-t{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.tl-nm{font-weight:800;font-size:18px;line-height:1.35;margin:2px 0}
.tl-m{color:var(--mute);font-size:13px}
.tl-gap{position:relative;display:flex;gap:14px;padding-bottom:16px}
.tl-gap .tl-n{background:var(--bg);border-style:dashed}
.tl-gap .tl-c{background:transparent;border:2px dashed var(--ink);font-weight:700;font-size:14px}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;border:1.5px solid var(--line);color:var(--mute);font-weight:700;vertical-align:2px;margin-left:4px}
.tag.out{background:var(--yellow-soft);border-color:var(--yellow);color:#4a3b00}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;color:#fff;margin-right:6px}
.pill.ok{background:var(--ok)}.pill.unsure{background:var(--unsure)}.pill.no{background:var(--no)}

/* 식사 판정 */
.vd-list{margin-top:10px;border-top:1px solid var(--line)}
.vd{padding:10px 0;border-bottom:1px solid var(--line)}
.vd:last-of-type{border-bottom:0}
.vd small{color:var(--mute)}
.order{margin-top:6px;background:var(--yellow-soft);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.5}
.warn{color:var(--unsure);font-size:12px;font-weight:700}

/* 지도 */
.mapcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.mapt{font-weight:800;margin:0 4px 8px}
.lmap{height:340px;border-radius:14px;z-index:0}
.mapcard small{display:block;margin-top:8px;color:var(--mute);font-size:12px}
.pin{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 13px system-ui,sans-serif;border:2px solid #1A1A1A}
.pin.out{background:#1A1A1A;color:#FFD84D}.pin.in{background:#fff;color:#1A1A1A}

/* 하루 더 */
.more{margin:8px 0 32px;text-align:center}
.more button{min-height:56px;padding:0 32px;border-radius:16px;border:2px solid var(--ink);background:var(--yellow);font-size:18px;font-weight:800}
.stay ul{margin:8px 0 0;padding-left:20px}
.stay{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;margin-top:16px}
.stay h4{margin:0}

</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div class="demo-bar" id="banner"></div>

<header class="top">
  <div class="wrap top-in">
    <div class="brand" id="brand"></div>
    <div class="seg seg-sm" role="group" aria-label="Language">
      <button type="button" id="langKo" data-lang="ko">KO</button>
      <button type="button" id="langEn" data-lang="en">EN</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1 id="hero"></h1>
    <p id="sub"></p>
  </div>
</section>

<main class="wrap">
  <form class="planner" id="planner" onsubmit="return false">
    <section class="step">
      <h2><span class="n">1</span><span id="s1"></span></h2>
      <div class="when">
        <label class="fld"><span id="lbDate"></span><input type="date" id="date"></label>
        <label class="fld"><span id="lbArr"></span><input type="time" id="arr"></label>
        <span class="arrow" aria-hidden="true">→</span>
        <label class="fld"><span id="lbDep"></span><input type="time" id="dep"></label>
      </div>
    </section>

    <section class="step">
      <h2><span class="n">2</span><span id="s2"></span></h2>
      <p class="hint" id="peopleHint"></p>
      <div id="people"></div>
      <button type="button" class="ghost" id="btnAdd"></button>
    </section>

    <section class="step">
      <h2><span class="n">3</span><span id="s3"></span></h2>
      <div class="how">
        <div class="seg" role="group">
          <button type="button" id="segWalk" data-mode="walk"></button>
          <button type="button" id="segCar" data-mode="car"></button>
        </div>
        <label class="switch"><input type="checkbox" id="indoor"><span class="track"></span><span id="lbIndoor"></span></label>
      </div>
    </section>

    <button type="button" class="cta" id="btnMake"></button>
    <div class="examples"><button type="button" class="link" id="btnA"></button><button type="button" class="link" id="btnB"></button></div>
  </form>

  <div id="result" aria-live="polite"></div>
</main>

<script>
// ============================================================
// 장소 데이터 (샘플). 실제 조사 데이터로 교체하세요.
// ⚠ 아래 15곳은 "구조 시연용 가상 샘플"입니다. 실제 가게 정보가 아닙니다.
//
// 필드 설명
//  type    : 'meal'(식사) | 'cafe'(카페·디저트) | 'activity'(체험·공방·시장)
//  area    : 'hanok'(한옥마을 안) | 'out'(한옥마을 밖)   ← "밖"의 정의는 팀이 확정 후 적용
//  x, y    : 한옥마을 중심(0,0) 기준 km 좌표 (실제로는 위·경도 → 거리 계산으로 교체)
//  open/close : 영업시간 'HH:MM'
//  closed  : 휴무 요일 (0=일 ... 6=토)
//  stay    : 예상 체류시간(분)
//  indoor  : 실내 여부
//  menus   : 식사 장소만. ing = 재료 배열, ing:null 이면 "재료 데이터 없음" → 절대 '가능' 아님
//    재료 키: meat(소·닭·양 등 육류) pork fish(생선·멸치육수 포함) shellfish egg dairy honey peanut alcohol
//  verified: true 이면 출처 "가게 확인(checked 날짜)", false 이면 "AI 추정"
// ============================================================
var PLACES = [
  // ---------- 식사 8 (한옥마을 안 2 / 밖 6) ----------
  { id:'m1', type:'meal', area:'hanok', name:'샘플 전통 비빔밥집', en:'Sample Traditional Bibimbap', x:0.1, y:0.1,
    open:'10:30', close:'20:30', closed:[], stay:60, indoor:true, checked:'2026-10-01',
    menus:[
      { ko:'전주 비빔밥', en:'Jeonju Bibimbap', ing:['meat','egg'], verified:false },
      { ko:'산채 비빔밥', en:'Mountain-herb Bibimbap', ing:[], verified:false }
    ]},
  { id:'m2', type:'meal', area:'hanok', name:'샘플 콩나물국밥집', en:'Sample Bean-sprout Soup', x:-0.2, y:0.2,
    open:'08:00', close:'21:00', closed:[], stay:45, indoor:true, checked:'2026-10-01',
    menus:[
      { ko:'콩나물국밥', en:'Bean-sprout Soup Rice', ing:['fish','egg'], verified:false },
      { ko:'오늘의 추가 메뉴', en:"Today's special", ing:null, verified:false }
    ]},
  { id:'m3', type:'meal', area:'out', name:'샘플 채식 식당', en:'Sample Vegan Kitchen', x:-1.0, y:0.8,
    open:'11:00', close:'20:30', closed:[1], stay:60, indoor:true, checked:'2026-10-01',
    menus:[
      { ko:'비건 쌈밥 정식', en:'Vegan Ssam Set', ing:[], verified:false },
      { ko:'두부 스테이크', en:'Tofu Steak', ing:['peanut'], verified:false }
    ]},
  { id:'m4', type:'meal', area:'out', name:'샘플 한정식집', en:'Sample Korean Table d\'hote', x:-1.3, y:0.4,
    open:'11:30', close:'21:00', closed:[0], stay:75, indoor:true, checked:'2026-10-01',
    menus:[
      { ko:'한정식 A', en:'Korean Set A', ing:['meat','pork','fish','egg','alcohol'], verified:false },
      { ko:'두부·나물 정식', en:'Tofu & Namul Set', ing:['fish'], verified:false }
    ]},
  { id:'m5', type:'meal', area:'out', name:'샘플 중동 음식점', en:'Sample Middle-Eastern Grill', x:-0.7, y:1.4,
    open:'11:00', close:'22:00', closed:[], stay:60, indoor:true, checked:'2026-10-01',
    menus:[
      { ko:'팔라펠 플레이트', en:'Falafel Plate', ing:[], verified:false },
      { ko:'양고기 케밥', en:'Lamb Kebab', ing:['meat'], verified:false },
      { ko:'치킨 라이스', en:'Chicken Rice', ing:['meat','dairy'], verified:false }
    ]},
  { id:'m6', type:'meal', area:'out', name:'샘플 칼국수집', en:'Sample Kalguksu', x:-1.6, y:1.0,
    open:'10:30', close:'19:30', closed:[2], stay:45, indoor:true, checked:'2026-10-01',
    menus:[
      { ko:'바지락 칼국수', en:'Clam Kalguksu', ing:['fish','shellfish'], verified:false },
      { ko:'비빔국수', en:'Spicy Cold Noodles', ing:['egg'], verified:false }
    ]},
  { id:'m7', type:'meal', area:'out', name:'샘플 시장 분식', en:'Sample Market Snack Bar', x:-0.9, y:-0.9,
    open:'09:00', close:'20:00', closed:[], stay:40, indoor:false, checked:'2026-10-01',
    menus:[
      { ko:'야채김밥', en:'Veggie Gimbap', ing:['egg'], verified:false },
      { ko:'떡볶이', en:'Tteokbokki', ing:['fish'], verified:false },
      { ko:'모듬 튀김', en:'Mixed Fry', ing:['shellfish','egg'], verified:false }
    ]},
  { id:'m8', type:'meal', area:'out', name:'샘플 양식 레스토랑', en:'Sample Western Bistro', x:-1.2, y:1.6,
    open:'11:30', close:'22:00', closed:[1], stay:75, indoor:true, checked:'2026-10-01',
    menus:[
      { ko:'가든 샐러드', en:'Garden Salad', ing:[], verified:false },
      { ko:'새우 파스타', en:'Shrimp Pasta', ing:['shellfish','dairy'], verified:false },
      { ko:'땅콩소스 샐러드', en:'Peanut-sauce Salad', ing:['peanut'], verified:false }
    ]},

  // ---------- 카페·디저트 3 ----------
  { id:'c1', type:'cafe', area:'hanok', name:'샘플 전통 찻집', en:'Sample Traditional Tea House', x:0.2, y:-0.1,
    open:'10:00', close:'21:00', closed:[], stay:50, indoor:true, checked:'2026-10-01' },
  { id:'c2', type:'cafe', area:'out', name:'샘플 로스터리 카페', en:'Sample Roastery Cafe', x:-1.1, y:1.1,
    open:'10:00', close:'22:00', closed:[], stay:60, indoor:true, checked:'2026-10-01' },
  { id:'c3', type:'cafe', area:'out', name:'샘플 수제 디저트 가게', en:'Sample Dessert Shop', x:-0.8, y:0.6,
    open:'11:00', close:'21:30', closed:[2], stay:45, indoor:true, checked:'2026-10-01' },

  // ---------- 체험·공방·시장 4 ----------
  { id:'a1', type:'activity', area:'hanok', name:'샘플 한복·전통 체험관', en:'Sample Hanbok Experience', x:0.0, y:0.0,
    open:'10:00', close:'18:00', closed:[], stay:60, indoor:true, checked:'2026-10-01' },
  { id:'a2', type:'activity', area:'out', name:'샘플 한지·도자기 공방', en:'Sample Hanji & Pottery Studio', x:-1.4, y:0.9,
    open:'10:00', close:'17:30', closed:[1], stay:90, indoor:true, checked:'2026-10-01' },
  { id:'a3', type:'activity', area:'out', name:'샘플 남부시장 구경', en:'Sample Traditional Market Walk', x:-0.9, y:-1.0,
    open:'09:00', close:'20:00', closed:[], stay:60, indoor:false, checked:'2026-10-01' },
  { id:'a4', type:'activity', area:'out', name:'샘플 원도심 야경 산책', en:'Sample Old-town Night Walk', x:-1.2, y:1.3,
    open:'00:00', close:'23:59', closed:[], stay:60, indoor:false, checked:'2026-10-01' }
];

// 한옥마을 기준점 (대략값. 팀이 "한옥마을 밖" 정의를 확정하면 함께 조정)
var HANOK = { lat: 35.8149, lng: 127.1530 };

// 좌표 정규화: 실제 데이터는 lat/lng만 넣으면 됩니다 (x, y는 자동 계산).
// 샘플은 x, y(km)만 있으므로 lat/lng를 역산합니다 (가상 위치).
PLACES.forEach(function (p) {
  var kx = 111.32 * Math.cos(HANOK.lat * Math.PI / 180), ky = 110.57;
  if (typeof p.lat === 'number' && typeof p.lng === 'number') {
    p.x = (p.lng - HANOK.lng) * kx;
    p.y = (p.lat - HANOK.lat) * ky;
  } else {
    p.lat = HANOK.lat + p.y / ky;
    p.lng = HANOK.lng + p.x / kx;
  }
});

// 숙박 권역 안내 (샘플 문구. 데이터 출처 미정)
var STAY_ZONES = [
  { ko:'원도심 일대 (샘플)', en:'Old-town area (sample)', note_ko:'다음 날 오전 루트와 가까움', note_en:'Close to next-morning route' },
  { ko:'전주역 인근 (샘플)', en:'Near Jeonju Station (sample)', note_ko:'귀가 시 이동이 편함', note_en:'Easy departure by train' }
];

</script>
<script>
/* 화면 문구 (한국어 / English) */

<script>
/* 루트 생성 + 식이 판정 (화면과 무관한 순수 로직. DOM 없이 node로 테스트 가능) */

/* ---------- 유틸 ---------- */
function toMin(s){ var p=s.split(':'); return +p[0]*60 + +p[1]; }
function fmt(m){ var h=Math.floor(m/60), mm=m%60; return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm; }
function weekday(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function addDays(dateStr,n){
  var d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n);
  var z=function(v){return (v<10?'0':'')+v;};
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
}

var WALK_MAX=25; // 도보 한 구간 최대 분

function travelMin(a,b,mode){
  if(!a) return 15; // 첫 이동: 전주역/터미널 → 첫 장소 (고정 가정)
  var d=Math.hypot(a.x-b.x,a.y-b.y);
  return Math.round(mode==='walk' ? d*1.3/4.5*60 : 5 + d*1.4/25*60);
}

/* ---------- 식이 판정 ---------- */
var RANK={ok:0,unsure:1,no:2};

// diets: ['vegan','halal','peanut','shellfish'] 중 0개 이상
// 반환 {s:'ok'|'unsure'|'no', reasons:[]}
function judgeMenu(menu, diets){
  if(!menu.ing) return {s:'unsure', reasons:['noData']}; // 재료 데이터 없으면 절대 '가능' 아님
  var worst='ok', reasons=[];
  function bump(s){ if(RANK[s]>RANK[worst]) worst=s; }
  function has(arr){ return arr.filter(function(k){return menu.ing.indexOf(k)>=0;}); }
  diets.forEach(function(d){
    var hit;
    if(d==='vegan'){ hit=has(['meat','pork','fish','shellfish','egg','dairy','honey']); if(hit.length){bump('no'); reasons.push({c:hit});} }
    else if(d==='halal'){
      hit=has(['pork','alcohol']); if(hit.length){bump('no'); reasons.push({c:hit});}
      else if(menu.ing.indexOf('meat')>=0){ bump('unsure'); reasons.push('halalMeat'); }
    }
    else if(d==='peanut'){ hit=has(['peanut']); if(hit.length){bump('no'); reasons.push({c:hit});} }
    else if(d==='shellfish'){ hit=has(['shellfish']); if(hit.length){bump('no'); reasons.push({c:hit});} }
  });
  return {s:worst, reasons:reasons};
}

// 한 장소에서 한 사람의 판정 = 메뉴들 중 가장 나은 것
function judgePerson(place, diets){
  var best=null, oks=[];
  place.menus.forEach(function(m){
    var j=judgeMenu(m,diets); j.menu=m;
    if(j.s==='ok') oks.push(m);
    if(!best || RANK[j.s]<RANK[best.s]) best=j;
  });
  return {s:best?best.s:'no', best:best, oks:oks};
}
function placeOkForAll(place, people){
  return people.every(function(p){ return judgePerson(place,p).s==='ok'; });
}

/* ---------- 루트 생성 ---------- */
var LUNCH=[11*60, 14*60+30], DINNER=[17*60+30, 20*60+30];

// opts: {date, arrive:'HH:MM', depart:'HH:MM', mode, people:[[diets]...], indoorOnly, exclude:[ids]}
function plan(opts){
  var arr=toMin(opts.arrive), dep=toMin(opts.depart), dow=weekday(opts.date);
  var cursor=arr, last=null, lastType=null, stops=[], gaps=[], used={};
  (opts.exclude||[]).forEach(function(id){used[id]=1;});
  var hadLunch=false, hadDinner=false;
  var short=(dep-arr<=120);
  var maxStops=short?3:99;

  function candidates(types){
    var out=[];
    PLACES.forEach(function(p){
      if(used[p.id] || types.indexOf(p.type)<0) return;
      if(p.closed.indexOf(dow)>=0) return;
      if(opts.indoorOnly && !p.indoor) return;
      if(p.type==='meal' && !placeOkForAll(p,opts.people)) return; // 조건을 몰래 완화하지 않음
      var tv=travelMin(last,p,opts.mode);
      if(last && opts.mode==='walk' && tv>WALK_MAX) return;
      var start=Math.max(cursor+tv, toMin(p.open));
      if(start-(cursor+tv)>30) return;            // 개점까지 30분 넘게 기다려야 하면 제외
      var end=start+p.stay;
      if(end>toMin(p.close) || end>dep) return;   // 영업시간·출발시간 안에 끝나야 함
      var score=(p.area==='out'?3:0) - tv/10;
      // 늦게까지 여는 장소는 저녁 이후를 위해 남겨 둔다
      if(p.type!=='meal' && start<17*60) score -= Math.max(0,(toMin(p.close)-20*60)/60)*2;
      out.push({p:p,tv:tv,start:start,end:end,score:score});
    });
    out.sort(function(a,b){return b.score-a.score;});
    return out;
  }

  var guard=0;
  while(cursor<dep-30 && stops.length<maxStops && guard++<100){
    var prefs;
    var inLunch=!hadLunch && cursor>=LUNCH[0]-30 && cursor<LUNCH[1];
    var inDinner=!hadDinner && cursor>=DINNER[0]-30 && cursor<DINNER[1];
    if(inLunch||inDinner) prefs=[['meal'],['cafe','activity']];
    else if(cursor>=20*60) prefs=[['cafe','activity']];
    else if(lastType==='meal'||lastType==='activity') prefs=[['cafe'],['activity']];
    else prefs=[['activity'],['cafe']];

    var pick=null;
    for(var i=0;i<prefs.length&&!pick;i++){ var c=candidates(prefs[i]); if(c.length) pick=c[0]; }
    if(!pick){
      var g=gaps[gaps.length-1];
      if(g && g.to===cursor) g.to=cursor+30; else gaps.push({from:cursor,to:cursor+30});
      cursor+=30; continue;
    }
    if(pick.p.type==='meal'){ if(cursor<LUNCH[1]+60 && pick.start<DINNER[0]-30) hadLunch=true; else hadDinner=true; }
    stops.push({place:pick.p, travel:pick.tv, start:pick.start, end:pick.end});
    used[pick.p.id]=1; last=pick.p; lastType=pick.p.type; cursor=pick.end;
  }
  if(!short && dep-cursor>60){ // 마지막 장소 이후 1시간 넘게 비면 gap
    var g2=gaps[gaps.length-1];
    if(g2 && g2.to>=cursor) g2.to=dep; else gaps.push({from:cursor,to:dep});
  }
  var total=stops.reduce(function(s,x){return s+x.travel+(x.end-x.start);},0);
  var out=stops.filter(function(x){return x.place.area==='out';}).length;
  return {stops:stops, gaps:gaps, stayMin:total, outCount:out,
          outRatio:stops.length?Math.round(out/stops.length*100):0,
          shopCount:stops.length, short:short, date:opts.date, arrive:arr, depart:dep};
}

    svg += '<circle cx="' + px(0) + '" cy="' + py(0) + '" r="' + (0.5 * k) + '" fill="#FFD84D55" stroke="#1A1A1A" stroke-dasharray="4 4"/>';

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
      var c = [HANOK.lat, HANOK.lng], pts = m.res.stops.map(function (s) { return [s.place.lat, s.place.lng]; });
      L.circle(c, { radius: 500, color: '#1A1A1A', weight: 1.5, dashArray: '4 4', fillColor: '#FFD84D', fillOpacity: 0.35 }).addTo(map).bindTooltip(S.hanokIn);
      L.polyline(pts, { color: '#1A1A1A', weight: 3, dashArray: '7 5' }).addTo(map);
      m.res.stops.forEach(function (s, i) {
        var inH = s.place.area === 'hanok';
        L.marker(pts[i], { icon: L.divIcon({ className: '', html: '<div class="pin ' + (inH ? 'in' : 'out') + '">' + (i + 1) + '</div>', iconSize: [26, 26], iconAnchor: [13, 13] }) })
          .addTo(map).bindTooltip(placeName(s.place));
      });
      map.fitBounds(L.latLngBounds(pts.concat([c])), { padding: [30, 30] });
    });
  }

  /* ---------- 타임라인 / 하루 구역 ---------- */
  function timelineHtml(res, people) {
    var S = t(), items = [];
    res.stops.forEach(function (s) { items.push({ k: 's', at: s.start, s: s }); });
    res.gaps.forEach(function (g) { items.push({ k: 'g', at: g.from, g: g }); });
    items.sort(function (a, b) { return a.at - b.at; });
    var h = '<ol class="tl">';
    items.forEach(function (it) {
      if (it.k === 'g') {
        h += '<li class="tl-gap"><span class="tl-n" aria-hidden="true">…</span><div class="tl-c">' + fmt(it.g.from) + '–' + fmt(it.g.to) + ' · ' + esc(S.gap) + ' (' + dur(it.g.to - it.g.from) + ')</div></li>';
        return;
      }
      var s = it.s, p = s.place, n = res.stops.indexOf(s) + 1;
      h += '<li class="tl-i"><span class="tl-n">' + n + '</span><div class="tl-c">'
        + '<div class="tl-t">' + fmt(s.start) + '–' + fmt(s.end) + '</div>'
        + '<div class="tl-nm">' + esc(placeName(p)) + '<span class="tag">' + S['type_' + p.type] + '</span><span class="tag ' + (p.area === 'out' ? 'out' : '') + '">' + (p.area === 'out' ? S.hanokOut : S.hanokIn) + '</span></div>'
        + '<div class="tl-m">' + S.moveMin + ' ' + s.travel + S.min + ' · ' + dur(s.end - s.start) + '</div>'
        + (p.type === 'meal' ? mealHtml(p, people) : '')
        + '</div></li>';
    });
    return h + '</ol>';
  }

  function summaryHtml(res, mainLabel, mainValue, ratio, shops) {
    var S = t();
    return '<div class="sum"><div class="sum-main"><small>' + esc(mainLabel) + '</small><b>' + mainValue + '</b></div>'
      + '<div class="stat"><small>' + S.mOut + '</small><b>' + ratio + '%</b></div>'
      + '<div class="stat"><small>' + S.mShops + '</small><b>' + shops + S.shops + '</b></div></div>';
  }

  function daySection(title, res, people, sumHtml) {
    var S = t(), h = '<section class="day"><h3 class="day-h">' + esc(title) + '</h3>' + sumHtml;
    if (!res.stops.length && !res.gaps.length) return h + '<div class="note">' + esc(S.nextEmpty) + '</div></section>';
    h += '<div class="day-grid"><div class="col-route">' + timelineHtml(res, people) + '</div><div class="col-map">' + mapHtml(res) + '</div></div></section>';
    return h;
  }

  /* ---------- 결과 ---------- */
  function show() {
    var S = t(), res = lastResult, people = lastOpts.people;
    var needAllergy = people.some(function (d) { return d.indexOf('peanut') >= 0 || d.indexOf('shellfish') >= 0; });
    var h = '';
    if (needAllergy) h += '<div class="alert" role="alert">' + esc(S.allergy) + '</div>';
    if (res.short) h += '<div class="note">' + esc(S.shortRoute) + '</div>';
    h += daySection(S.dayOne, res, people, summaryHtml(res, S.mStay, dur(res.stayMin), res.outRatio, res.shopCount));
    h += '<div class="more"><button type="button" id="btnNext">' + esc(S.nextDay) + '</button></div><div id="next"></div>';
    $('result').innerHTML = h;
    initMaps();
    $('btnNext').onclick = showNext;
  }

  function showNext() {
    var S = t(), r1 = lastResult, people = lastOpts.people;
    var used = r1.stops.map(function (s) { return s.place.id; });
    var r2 = plan(Object.assign({}, lastOpts, { date: addDays(lastOpts.date, 1), arrive: '09:30', depart: '13:30', exclude: used }));
    var all = r1.stops.length + r2.stops.length, outAll = r1.outCount + r2.outCount;
    var h = daySection(S.dayTwo, r2, people, summaryHtml(r2, S.totalStay, dur(r1.stayMin + r2.stayMin), all ? Math.round(outAll / all * 100) : 0, all));
    h += '<div class="stay"><h4>' + esc(S.stayZone) + '</h4><ul>' + STAY_ZONES.map(function (z) {
      return '<li>' + esc(state.lang === 'en' ? z.en : z.ko) + ' — ' + esc(state.lang === 'en' ? z.note_en : z.note_ko) + '</li>';
    }).join('') + '</ul></div>';
    $('next').innerHTML = h;
    initMaps();
    $('next').scrollIntoView({ behavior: 'smooth' });
  }

  function make() {
    var arr = $('arr').value, dep = $('dep').value;
    if (!arr || !dep || toMin(dep) <= toMin(arr)) { $('result').innerHTML = '<div class="alert" role="alert">' + esc(t().errTime) + '</div>'; return; }
    lastOpts = { date: $('date').value || today(), arrive: arr, depart: dep, mode: state.mode,
      people: state.people.map(function (a) { return a.slice(); }), indoorOnly: $('indoor').checked };
    lastResult = plan(lastOpts);
    show();
  }

  function example(kind) {
    if (kind === 'A') { state.lang = 'ko'; $('arr').value = '13:00'; $('dep').value = '21:00'; state.mode = 'walk'; state.people = [[], []]; }
    else { state.lang = 'en'; $('arr').value = '10:00'; $('dep').value = '21:00'; state.mode = 'car'; state.people = [['halal'], [], [], []]; }
    renderStatic(); make();
  }

  window.addEventListener('DOMContentLoaded', function () {
    $('date').value = today(); $('arr').value = '13:00'; $('dep').value = '21:00';
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.onclick = function () { state.lang = b.dataset.lang; renderStatic(); if (lastResult) show(); }; });
    document.querySelectorAll('[data-mode]').forEach(function (b) { b.onclick = function () { state.mode = b.dataset.mode; renderStatic(); }; });
    $('btnAdd').onclick = function () { state.people.push([]); renderPeople(); };
    $('btnMake').onclick = make; $('btnA').onclick = function () { example('A'); }; $('btnB').onclick = function () { example('B'); };
    renderStatic();
  });
})();

</script>
</body>
</html>
