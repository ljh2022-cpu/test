<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전주 머물다 - 청년 정착 매칭</title>
<style>
  :root{--bg:#f5f8ff;--card:#fff;--ink:#14213d;--muted:#5b6785;--primary:#1d4ed8;--accent:#f59e0b;--line:#e2e8f5}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  header{background:linear-gradient(135deg,var(--primary),#4f7cff);color:#fff;padding:40px 20px 56px;text-align:center}
  header .tag{display:inline-block;font-size:12px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:999px;margin-bottom:12px}
  header h1{font-size:28px}
  header p{opacity:.92;margin-top:8px;font-size:15px}
  main{max-width:860px;margin:-28px auto 40px;padding:0 16px}
  .panel{background:var(--card);border-radius:18px;box-shadow:0 8px 28px rgba(29,78,216,.1);padding:22px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .stat{background:#eaf0ff;border-radius:12px;padding:12px;text-align:center}
  .stat b{display:block;font-size:20px;color:var(--primary)}
  .stat span{font-size:12px;color:var(--muted)}
  h2{font-size:16px;margin:4px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;font-family:inherit}
  button{margin-top:16px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  button:hover{background:#1e40af}
  #result{margin-top:24px}
  .sec{margin-bottom:22px}
  .sec h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .sec h3::before{content:"";width:5px;height:16px;border-radius:3px;background:var(--accent)}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .item b{display:block}
  .item small{color:var(--muted)}
  .empty{color:var(--muted);font-size:14px;padding:8px 0}
  .note{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
  .src{font-size:12px;color:var(--muted);margin-top:14px}
  @media(max-width:520px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="tag">HUSS 바이브 코딩 경진대회 · 지역 가치 맹글기 아이디어</div>
  <h1>전주 머물다</h1>
  <p>졸업허는 청년들헌테 전주 일자리·집·지원금을 한 화면에 싹 보여 드릴랑께요</p>
</header>

<main>
  <section class="panel">
    <div class="stats">
      <div class="stat"><b>-9,600명</b><span>2026 1분기 전주 인구 줄어든 거(작년 대비)</span></div>
      <div class="stat"><b>-2,300명</b><span>2026 1분기 전주서 빠져나간 사람</span></div>
      <div class="stat"><b>11.2만명</b><span>2024 전주 청년(19~34세) 인구</span></div>
    </div>
    <p class="src">출처: 전북일보 2026.4.29, 전북일보 NIE 2025.5.27 보도</p>

    <h2 style="margin-top:16px">내 사정을 골라보쇼잉</h2>
    <div class="grid">
      <div><label for="field">뭐에 관심 있소</label>
        <select id="field">
          <option value="public">공공·행정</option>
          <option value="it">IT·데이터</option>
          <option value="culture">문화·관광</option>
          <option value="food">식품·농생명</option>
        </select></div>
      <div><label for="house">사는 건 어떻소</label>
        <select id="house">
          <option value="rent">월세·전세가 부담돼부러요</option>
          <option value="family">부모님 집서 지내요</option>
          <option value="none">아직 못 정했당께요</option>
        </select></div>
      <div><label for="status">지금 어떤 상황이오</label>
        <select id="status">
          <option value="grad">졸업 예정이요</option>
          <option value="seek">구직 중이요</option>
          <option value="start">창업 준비 중이요</option>
        </select></div>
    </div>
    <button id="go">나헌테 맞는 정보 보여주쇼잉</button>

    <div id="result"></div>
    <p class="note">※ 아래 결과는 시연용 예시 데이터랑께. 진짜 공고랑 지원금은 전주시·전북특별자치도 공식 안내를 꼭 확인허쇼잉.</p>
  </section>
</main>

<script>
const DB = {
  jobs: {
    public:  [["지역 공공기관 청년 인턴 (예시)","행정 거들기 · 정책 자료 정리"],["청년 정책 서포터즈 (예시)","정책 알리기 · 모니터링"]],
    it:      [["지역 스타트업 데이터 분석 신입 (예시)","데이터 정리 · 그래프 맹글기"],["로컬 서비스 웹 개발 인턴 (예시)","웹 화면 기초 맹글기"]],
    culture: [["관광 콘텐츠 기획 인턴 (예시)","지역 관광 코스 짜기"],["문화재단 행사 스태프 (예시)","축제·야행 행사 꾸리기"]],
    food:    [["지역 식품기업 마케팅 신입 (예시)","온라인 판매 · 브랜드 맹글기"],["푸드테크 연구보조 (예시)","시장조사 · 제품 시험"]]
  },
  housing: {
    rent:   [["청년 월세 지원 (예시)","월세 일부를 일정 기간 보태줌"],["청년 임대주택 안내 (예시)","시세보다 싸게 보증금·임대료"]],
    family: [["청년 독립 준비 상담 (예시)","집 계획 · 대출 상담"]],
    none:   [["주거 정보 통합 상담 (예시)","동네별 집 종류 비교 안내"]]
  },
  support: {
    grad:  [["졸업예정자 취업 연결 프로그램 (예시)","지역 기업 채용 설명회·면접 도와줌"]],
    seek:  [["청년 구직활동 수당 (예시)","구직허는 데 드는 돈 일부 보태줌"]],
    start: [["청년 창업 공간·멘토링 (예시)","창업 공간 쓰고 전문가 상담받음"]]
  }
};
function block(title, list){
  const html = list.length
    ? list.map(i=>`<div class="item"><b>${i[0]}</b><small>${i[1]}</small></div>`).join("")
    : '<div class="empty">해당허는 정보가 없당께요.</div>';
  return `<div class="sec"><h3>${title}</h3>${html}</div>`;
}
document.getElementById("go").addEventListener("click", ()=>{
  const f = document.getElementById("field").value;
  const h = document.getElementById("house").value;
  const s = document.getElementById("status").value;
  document.getElementById("result").innerHTML =
    block("일자리·인턴", DB.jobs[f]) + block("집 지원", DB.housing[h]) + block("사정별 지원", DB.support[s]);
});
</script>
</body>
</html>
